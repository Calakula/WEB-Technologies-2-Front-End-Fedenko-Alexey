    <h1>Task 1 — Geometric Composition</h1>
    <p>A single 6&times;6 CSS Grid. The black lines come from the grid gap, not from borders or margins.</p>

    <div class="composition">
      <div class="block block--blue"></div>
      <div class="block block--top"></div>
      <div class="block block--yellow"></div>
      <div class="block block--right"></div>
      <div class="block block--red"></div>
      <div class="block block--black"></div>
      <div class="block block--bottom"></div>
    </div>
  </main>
